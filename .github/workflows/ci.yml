name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Core public API compatibility
        run: pnpm -C packages/core api:check

      - name: Core public API guard regression tests
        run: pnpm -C packages/core api:guard:test

      - name: Core API report fingerprint
        run: pnpm -C packages/core api:fingerprint:check

      - name: Security-gate wiring regression tests
        run: pnpm run security:gate:test

      - name: S_freeze verifier regression tests
        run: pnpm test:s-freeze

      - name: Website lint (best-effort)
        run: pnpm -C website lint || echo "website lint skipped (format locally)"

      - name: Test
        # Agentgram demo skipped in CI due to IPC/Unix socket permission limits; run locally if environment allows.
        run: pnpm -r --filter=!@examples/agentgram-demo test

      - name: Conformance
        run: pnpm -C packages/core build && pnpm -C packages/conformance validate
        env:
          OXDEAI_ENGINE_SECRET: test-secret-must-be-at-least-32-chars!!

      - name: Vectors (TS canonicalization)
        run: pnpm test:vectors:ts

      - name: Vectors (Authorization)
        run: pnpm test:vectors:auth

      - name: Vectors (PEP gateway)
        run: pnpm test:vectors:pep

      - name: Vectors (Delegation)
        run: pnpm test:vectors:delegation

      - name: Vectors (Go canonicalization)
        run: pnpm test:vectors:go

      - name: Vectors (Python canonicalization)
        run: pnpm test:vectors:py

  spec-claims:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify corpus authority and Profile-C projection
        run: pnpm verify:corpus-authority && pnpm test:corpus-authority

      - name: Verify spec claims
        run: pnpm verify:spec-claims

      - name: Test spec-claims checker
        run: pnpm test:spec-claims

  adapter-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r build

      - name: Validate adapters
        run: pnpm validate:adapters
        env:
          OXDEAI_ENGINE_SECRET: ci-adapter-validation-secret-testing!!

  packed-artifact-consumer-gate:
    # Self-contained by design (does not reuse build-test's dist/ output):
    # this job proves the actual packed-tarball install path end to end,
    # independently of whatever the source-workspace jobs above already
    # verified. See scripts/verify-packed-artifacts.mjs.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Packed Artifact Consumer Gate
        run: pnpm run verify:packed-artifacts

  rust-verifier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/rust-verifier

      - name: Rust verifier tests
        # Pins the bundled fixture's ALLOW/DENY cases at deterministic protocol
        # time (issue #262). Fails if the fixture or the expiry contract rots.
        run: cargo test --locked
        working-directory: examples/rust-verifier

  pep-redis-replay:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Wait for Redis
        run: |
          node -e '
            const net = require("node:net");
            const deadline = Date.now() + 30_000;
            const tryConnect = () => {
              const socket = net.connect({ host: "127.0.0.1", port: 6379 });
              socket.once("connect", () => { socket.end(); process.exit(0); });
              socket.once("error", () => {
                socket.destroy();
                if (Date.now() >= deadline) {
                  console.error("Redis did not become ready on 127.0.0.1:6379");
                  process.exit(1);
                }
                setTimeout(tryConnect, 500);
              });
            };
            tryConnect();
          '

      - name: Build workspace dependencies
        run: |
          pnpm --filter @oxdeai/core build
          pnpm --filter @oxdeai/guard build

      - name: PEP live Redis replay integration
        run: pnpm --filter @oxdeai/example-lgf-frappe-pep test:redis
        env:
          REDIS_URL: redis://127.0.0.1:6379

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
