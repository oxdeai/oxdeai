<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>OxDeAI: every protected agent action needs a signed, single-use authorization for that exact action</title>
  <rect x="8" y="8" width="1184" height="594" rx="26" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- decision labels -->
  <g font-size="15" font-weight="700" letter-spacing="1.5" text-anchor="middle">
    <text x="168" y="88" fill="#16a34a">ALLOW</text>
    <text x="384" y="88" fill="#dc2626">NOT COVERED</text>
    <text x="600" y="88" fill="#d97706">REPLAY</text>
    <text x="816" y="88" fill="#dc2626">DENY</text>
    <text x="1032" y="88" fill="#16a34a">ALLOW</text>
  </g>

  <!-- agent cards -->
  <g fill="#ffffff" stroke="#d1d5db" stroke-width="2">
    <rect x="76" y="106" width="184" height="112" rx="16"/>
    <rect x="292" y="106" width="184" height="112" rx="16"/>
    <rect x="508" y="106" width="184" height="112" rx="16"/>
    <rect x="724" y="106" width="184" height="112" rx="16"/>
    <rect x="940" y="106" width="184" height="112" rx="16"/>
  </g>

  <!-- action icons -->
  <g fill="none" stroke="#374151" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- card payment -->
    <g transform="translate(168 144)">
      <rect x="-18" y="-12" width="36" height="24" rx="4"/><path d="M-18 -4 L18 -4 M-11 6 L-3 6"/>
    </g>
    <!-- card payment, larger amount -->
    <g transform="translate(384 144)">
      <rect x="-18" y="-12" width="36" height="24" rx="4"/><path d="M-18 -4 L18 -4 M-11 6 L-3 6"/>
      <path d="M10 2 L10 10 M6 6 L14 6" stroke="#dc2626"/>
    </g>
    <!-- repeat -->
    <g transform="translate(600 144)">
      <path d="M-13 -3 A13 13 0 0 1 11 -7 M13 3 A13 13 0 0 1 -11 7"/>
      <path d="M11 -15 L11 -7 L3 -7 M-11 15 L-11 7 L-3 7"/>
    </g>
    <!-- deploy -->
    <g transform="translate(816 144)">
      <path d="M0 -15 L0 9 M-9 -6 L0 -15 L9 -6 M-15 15 L15 15"/>
    </g>
    <!-- record -->
    <g transform="translate(1032 144)">
      <path d="M-12 -15 L5 -15 L12 -8 L12 15 L-12 15 Z M5 -15 L5 -8 L12 -8 M-6 0 L6 0 M-6 7 L6 7"/>
    </g>
  </g>

  <g font-size="18" fill="#1f2937" text-anchor="middle" font-weight="500">
    <text x="168" y="186">charge $500</text>
    <text x="384" y="186">charge $50,000</text>
    <text x="600" y="186">charge $500 again</text>
    <text x="816" y="186">deploy to prod</text>
    <text x="1032" y="186">update record</text>
  </g>
  <g font-size="13" fill="#9ca3af" text-anchor="middle">
    <text x="168" y="206">auth for $500</text>
    <text x="384" y="206">auth for $500</text>
    <text x="600" y="206">same auth_id</text>
    <text x="816" y="206">policy says no</text>
    <text x="1032" y="206">auth for record</text>
  </g>

  <!-- connectors top -->
  <g stroke="#94a3b8" stroke-width="2.5">
    <line x1="168" y1="218" x2="168" y2="300"/>
    <line x1="384" y1="218" x2="384" y2="300"/>
    <line x1="600" y1="218" x2="600" y2="300"/>
    <line x1="816" y1="218" x2="816" y2="300"/>
    <line x1="1032" y1="218" x2="1032" y2="300"/>
  </g>
  <g font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
    <text x="182" y="264">INTENT</text>
    <text x="398" y="264">INTENT</text>
    <text x="614" y="264">INTENT</text>
    <text x="830" y="264">INTENT</text>
    <text x="1046" y="264">INTENT</text>
  </g>

  <!-- boundary band -->
  <rect x="60" y="300" width="1080" height="100" rx="20" fill="#f6fbf8" stroke="#28C76F" stroke-width="2.5"/>
  <g transform="translate(322 350)" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -20 L16 -13 L16 0 Q16 14 0 21 Q-16 14 -16 0 L-16 -13 Z"/>
    <path d="M-6 0 L-1 5 L7 -5"/>
  </g>
  <text x="354" y="348" font-size="30" font-weight="800" fill="#111111" letter-spacing="2.5">OxDeAI Execution Boundary</text>
  <text x="354" y="377" font-size="16" fill="#15803d" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">decide · verify · execute once, or refuse</text>

  <!-- connectors bottom -->
  <g stroke="#94a3b8" stroke-width="2.5">
    <line x1="330" y1="400" x2="330" y2="456"/>
    <line x1="600" y1="400" x2="600" y2="456"/>
    <line x1="870" y1="400" x2="870" y2="456"/>
  </g>

  <!-- capability boxes -->
  <rect x="200" y="456" width="260" height="122" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2.5"/>
  <rect x="470" y="456" width="260" height="122" rx="18" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2.5"/>
  <rect x="740" y="456" width="260" height="122" rx="18" fill="#fffbeb" stroke="#fde68a" stroke-width="2.5"/>

  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- deterministic: equals in brackets -->
    <g transform="translate(330 492)" stroke="#2563eb">
      <path d="M-14 -14 L-19 -14 L-19 14 L-14 14 M14 -14 L19 -14 L19 14 L14 14"/>
      <path d="M-8 -4 L8 -4 M-8 4 L8 4"/>
    </g>
    <!-- signed artifact: document with seal -->
    <g transform="translate(600 492)" stroke="#16a34a">
      <path d="M-13 -17 L5 -17 L13 -9 L13 17 L-13 17 Z M5 -17 L5 -9 L13 -9"/>
      <circle cx="0" cy="5" r="6"/>
      <path d="M-3 10 L-5 17 M3 10 L5 17"/>
    </g>
    <!-- replay protection: loop with stop bar -->
    <g transform="translate(870 492)" stroke="#d97706">
      <circle cx="0" cy="0" r="17"/>
      <path d="M-12 -12 L12 12"/>
    </g>
  </g>

  <g text-anchor="middle">
    <text x="330" y="538" font-size="19" font-weight="700" fill="#1f2937">Deterministic Policy</text>
    <text x="330" y="561" font-size="14" fill="#6b7280">same inputs → same decision</text>
    <text x="600" y="538" font-size="19" font-weight="700" fill="#1f2937">Signed AuthorizationV1</text>
    <text x="600" y="561" font-size="14" fill="#6b7280">Ed25519, keys the verifier trusts</text>
    <text x="870" y="538" font-size="19" font-weight="700" fill="#1f2937">Replay Protection</text>
    <text x="870" y="561" font-size="14" fill="#6b7280">each auth_id consumed once</text>
  </g>
</svg>
