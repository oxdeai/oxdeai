<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Agent gets AuthorizationV1 from the PDP; the PEP gateway verifies it before the protected tool runs; direct calls are refused</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="1184" height="454" rx="26" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- PDP -->
  <rect x="50" y="30" width="220" height="84" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2.5"/>
  <text x="160" y="66" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">OxDeAI PDP</text>
  <text x="160" y="92" text-anchor="middle" font-size="13.5" fill="#6b7280" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">(intent, state, policy)</text>

  <!-- Agent -->
  <rect x="60" y="180" width="200" height="120" rx="16" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <g transform="translate(160 218)" fill="none" stroke="#374151" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-16" y="-12" width="32" height="24" rx="7"/>
    <circle cx="-6" cy="0" r="2.5"/><circle cx="6" cy="0" r="2.5"/>
    <path d="M0 -12 L0 -18"/>
  </g>
  <text x="160" y="272" text-anchor="middle" font-size="20" font-weight="500" fill="#1f2937">Agent</text>

  <!-- Gateway band -->
  <rect x="400" y="168" width="400" height="144" rx="20" fill="#f6fbf8" stroke="#28C76F" stroke-width="2.5"/>
  <g transform="translate(600 204)" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -17 L14 -11 L14 0 Q14 12 0 18 Q-14 12 -14 0 L-14 -11 Z"/>
    <path d="M-5 0 L-1 4 L6 -4"/>
  </g>
  <text x="600" y="248" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="2" fill="#111111">PEP Gateway</text>
  <text x="600" y="274" text-anchor="middle" font-size="14" fill="#15803d">signature · trusted keys · audience · expiry</text>
  <text x="600" y="295" text-anchor="middle" font-size="14" fill="#15803d">intent hash = exact action · single use</text>

  <!-- Upstream -->
  <rect x="940" y="180" width="200" height="120" rx="16" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <g transform="translate(1040 216)" fill="none" stroke="#374151" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-13" y="-4" width="26" height="20" rx="4"/>
    <path d="M-8 -4 L-8 -10 A8 8 0 0 1 8 -10 L8 -4"/>
  </g>
  <text x="1040" y="264" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Protected</text>
  <text x="1040" y="287" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Tool</text>
  <text x="1040" y="160" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.5" fill="#16a34a">EXECUTES</text>

  <!-- flows -->
  <g stroke="#64748b" stroke-width="2.5" fill="none">
    <line x1="260" y1="240" x2="396" y2="240" marker-end="url(#arrow)"/>
    <line x1="800" y1="240" x2="936" y2="240" marker-end="url(#arrow)"/>
    <line x1="138" y1="176" x2="138" y2="119" marker-end="url(#arrow)"/>
    <line x1="182" y1="118" x2="182" y2="175" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12.5" font-weight="600" fill="#94a3b8" letter-spacing="1.2" text-anchor="middle">
    <text x="328" y="226">ACTION +</text>
    <text x="328" y="262">AUTHORIZATION</text>
    <text x="868" y="226">ALLOW</text>
    <text x="868" y="262">ONLY</text>
    <text x="126" y="152" text-anchor="end">INTENT</text>
    <text x="194" y="152" text-anchor="start">AUTHORIZATIONV1</text>
  </g>

  <!-- bypass attempt -->
  <path d="M160 300 L160 380 Q160 400 180 400 L1020 400 Q1040 400 1040 380 L1040 306" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrow-red)"/>
  <rect x="510" y="382" width="180" height="36" rx="18" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="600" y="406" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">direct call → 403</text>
  <text x="600" y="446" text-anchor="middle" font-size="14" fill="#6b7280">demo deployment: only the PEP holds the upstream executor token</text>
</svg>
